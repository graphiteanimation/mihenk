<!doctype html>
<html lang="tr" data-theme="light" data-density="normal">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mihenk</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
<div id="app" class="app">
  <header id="menubar" class="titlebar on-dark"></header>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="toolbar" class="ribbon" role="toolbar"></div>
  <div id="main" class="main">
    <aside id="browser" class="browser" aria-label="browser"></aside>
    <div id="viewwrap" class="viewwrap">
      <div id="viewport" tabindex="0" role="application"></div>
      <div id="overlay"></div>
      <div class="vp-overlay-tl"><div id="hud" class="hud hidden" data-testid="hud"></div></div>
      <div class="vp-overlay-tr"><div id="viewcube" class="viewcube" data-testid="viewcube"></div><div id="viewbtns" class="vbtns" data-testid="viewbtns"></div><div id="viewtoggles" class="vbtns"></div></div>
      <div id="hint" class="vp-hint hidden" role="status"><span id="hint-text"></span></div>
      <div id="measurebox" class="hidden"></div>
      <div id="empty" class="hidden"></div>
      <div id="loading"><div class="spinner"></div><span data-i18n="ld.loading"></span></div>
    </div>
    <aside id="panel" class="panel hidden"></aside>
  </div>
  <div id="timeline" class="timeline"></div>
  <footer id="status" class="statusbar on-dark"><div id="statusbar-main" class="sb-main"></div><div id="statusbar-quick" class="sb-quick"></div></footer>
  <section id="welcome" class="welcome hidden" data-testid="welcome"></section>
  <div id="toast" class="toasts hidden" aria-live="polite"></div>
  <div id="ctx" class="hidden"></div>
  <div id="modal" class="scrim hidden"></div>
</div>
<script type="module" src="/src/ui/app.js"></script>
</body>
</html>
