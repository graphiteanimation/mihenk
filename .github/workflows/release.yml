# `v*` etiketi itilince: ci.yml'deki aynı iş (test + paket + duman testi) → GitHub Release'e kurulum + SHA-256.
# Kuru koşu (etiketsiz): Actions > release > Run workflow (workflow_dispatch). Aynı iş çalışır, sürüm eşleşmesi ve SHA-256 denetlenir,
# ama Release OLUŞTURULMAZ ("GitHub Release" adımı yalnız etiket koşusunda çalışır).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kaynak:
    # Etiketin gösterdiği commit master'ın atasıdır (master'a girmemiş dal commit'i etiketlenip yayımlanamaz). Kuru koşuda atlanır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Etiket master'dan türüyor mu
        if: github.ref_type == 'tag'
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "Etiket $GITHUB_REF_NAME ($GITHUB_SHA) master'ın atası değil: yayım durduruldu"; exit 1; }
          echo "Etiket commit'i master geçmişinde"
  ci:
    needs: kaynak
    uses: ./.github/workflows/ci.yml
  surum:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}   # etiket koşusunda etiket; kuru koşuda boş
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: Mihenk-Kurulum, path: kurulum }
      - name: Etiket = package.json sürümü ve SHA-256
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ]; then [ "v$VER" = "$TAG" ] || { echo "Etiket $TAG, package.json sürümü $VER: eşleşmiyor"; exit 1; }; else echo "KURU KOŞU (etiket yok): sürüm $VER; Release oluşturulmayacak"; fi
          [ -f "kurulum/Mihenk-Kurulum-$VER.exe" ] || { echo "kurulum/Mihenk-Kurulum-$VER.exe yok"; ls -l kurulum; exit 1; }
          (cd kurulum && sha256sum -c SHA256SUMS.txt)
      - name: GitHub Release (yalnız etiket koşusu)
        if: github.ref_type == 'tag'
        run: |
          gh release create "$TAG" kurulum/Mihenk-Kurulum-*.exe kurulum/SHA256SUMS.txt --title "Mihenk ${TAG#v}" --generate-notes --verify-tag
