# Mihenk otomatik derleme ve sürüm kapısı (WP-20, O-034, CALISMA-DUZENI §8).
# test  : Windows'ta `npm run test:all` (adım adım rapor: scripts/test-all.mjs)
# paket : `npm run dist` → kurulumu sessiz kur → kurulu exe'ye karşı duman testi (aç, kaydet, NC/DXF kaydet) → sessiz kaldır
# yayin : ikisi de yeşilse kurulum + SHA-256 resmi çıktı olarak yüklenir (yalnız master'da 30 gün, dallarda 5 gün)
name: ci
on:
  push:
    branches: [master, 'wp-**']
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  RETENTION: ${{ github.ref == 'refs/heads/master' && 30 || 5 }}
jobs:
  test:
    runs-on: windows-latest
    env:
      MODEL_STL_TAM: '1' # part-h: büyük parçalarda STL yeniden içe almayı atlama, tam koş (8 GB sınırı yerel makineye özgü)
    timeout-minutes: 75
    steps:
      # Altın dosya karşılaştırmaları satır sonuna duyarlı: Windows'ta CRLF'ye çevrilmesin
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Python playwright
        run: python -m pip install --disable-pip-version-check playwright==1.63.0
      - name: Chrome (Python testleri channel='chrome' kullanır)
        shell: pwsh
        run: |
          $c = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $c)) { $c = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }
          if (Test-Path $c) { "Chrome hazır: " + (Get-Item $c).VersionInfo.ProductVersion }
          else { "Chrome yok, kuruluyor"; python -m playwright install chrome }
      - run: npm ci
      - name: npm run test:all
        run: npm run test:all
      - name: Test günlükleri
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-gunlukleri
          path: |
            release/test-logs
            test/shots
          if-no-files-found: ignore
          retention-days: 5

  paket:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: NSIS (makensis) hazırla (sürüm sabit)
        shell: pwsh
        env:
          NSIS_VERSION: '3.13.0'
        run: |
          # Sürüm sabitlenir: kurulum dosyası koşudan koşuya aynı derleyiciyle üretilsin. Yoksa sabit sürüm kurulur; sonunda sürüm doğrulanır.
          # makensis /VERSION yalnız "v3.13" gibi ana.alt sürümü yazar
          $want = $env:NSIS_VERSION -replace '^(\d+\.\d+).*', '$1'
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { foreach ($d in @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")) { if (Test-Path "$d\makensis.exe") { $mk = "$d\makensis.exe" } } }
          $ver = if ($mk) { (& $mk /VERSION).Trim().TrimStart('v') } else { '' }
          if ($ver -ne $want) {
            "NSIS '$ver' (istenen $env:NSIS_VERSION), choco ile sabit sürüm kuruluyor"
            choco install nsis --version $env:NSIS_VERSION --allow-downgrade --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"; if (-not (Test-Path $mk)) { $mk = "$env:ProgramFiles\NSIS\makensis.exe" }
            $ver = (& $mk /VERSION).Trim().TrimStart('v')
            if ($ver -ne $want) { "NSIS sürümü uyuşmuyor: $ver"; exit 1 }
          }
          "NSIS $ver"
      - name: npm run dist
        run: npm run dist
      - name: Kurulum dosyası ve SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release/Mihenk-Kurulum-*.exe | ForEach-Object { "{0}  {1:N0} bayt" -f $_.Name, $_.Length }
          Get-Content release/SHA256SUMS.txt
      - name: Kurulu sürüm duman testi (sessiz kur, aç, kaydet, NC/DXF kaydet, kaldır)
        run: npm run test:installed
      - name: Kurulum + SHA-256 (ham, yalnız yayin işi için)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kurulum-ham
          path: |
            release/Mihenk-Kurulum-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  yayin:
    needs: [test, paket]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: kurulum-ham, path: kurulum }
      - name: SHA-256 doğrula
        working-directory: kurulum
        run: |
          sha256sum -c SHA256SUMS.txt
          ls -l
          { echo '### Kurulum çıktısı'; echo '```'; cat SHA256SUMS.txt; ls -l Mihenk-Kurulum-*.exe; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mihenk-Kurulum
          path: |
            kurulum/Mihenk-Kurulum-*.exe
            kurulum/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.RETENTION) }}
